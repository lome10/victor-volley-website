<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articolo — Victor Volley</title>
  <meta name="description" content="Leggi le ultime notizie dalla Victor Volley.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Victor Volley">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Articolo — Victor Volley">
  <meta property="og:description" content="Leggi le ultime notizie dalla Victor Volley.">
  <meta property="og:image" content="https://www.victorvolley.it/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>if(sessionStorage.getItem('vv_splash_shown')){document.documentElement.classList.add('no-splash');}</script>
  <noscript><style>#splash-screen{display:none!important}</style></noscript>
  <link rel="preload" href="/assets/fonts/barlow-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/manrope-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="css/style.css?v=20261002o">
</head>
<body>

  <a href="#main-content" class="skip-link">Salta al contenuto</a>

  <div id="splash-screen" role="status" aria-label="Caricamento Victor Volley">
    <div class="splash-top">
      <img src="assets/logo.png" alt="Victor Volley" class="splash-logo">
    </div>
    <div class="splash-line" aria-hidden="true"></div>
    <div class="splash-bottom" aria-hidden="true">
      <div class="splash-percent" id="splashPercent">0%</div>
    </div>
  </div>

  <header class="site-header" role="banner"></header>

  <main id="main-content" tabindex="-1">

    <section class="section section--article">
      <div class="container">

        <div class="art-sponsors" id="articleSponsors"></div>

        <div style="margin-bottom:32px">
          <a href="/news" style="color:var(--c-azzurro);font-size:14px;font-weight:500;text-decoration:none">
            &larr; Torna alle news
          </a>
        </div>

        <article class="article-content" id="articleContent">

          <!-- Copertina 9:16 sticky a sinistra, articolo a destra: solo il testo scorre -->
          <div class="article-split">
            <aside class="article-media-col">
              <div id="articleCover" class="article-hero-media"></div>
            </aside>
            <div class="article-text-col">
              <div class="article-meta">
                <span id="articleCategory" style="display:contents"></span>
                <span class="article-date" id="articleDate"></span>
              </div>
              <h1 id="articleTitle"></h1>
              <div class="article-body" id="articleBody"></div>
            </div>
          </div>

        </article>

        <!-- Articoli correlati -->
        <div id="relatedSection" class="related-section" style="margin-top:64px;padding-top:48px;border-top:1px solid var(--c-gray-light);display:none">
          <h3 style="margin-bottom:24px">Articoli correlati</h3>
          <div class="related-cards" id="relatedGrid"></div>
          <div class="related-dots-mobile" id="relatedDotsMobile"></div>
        </div>

      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo"></footer>

  <!-- Firebase SDK (compat) -->
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/vendor/purify.min.js"></script>
  <script src="js/data.js?v=20261002i"></script>
  <script src="js/db.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/esc.js?v=20261002f"></script>
  <script src="js/components.js?v=20261002i"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>

  <script src="js/pages/news-dettaglio-1.js?v=20261002m"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
