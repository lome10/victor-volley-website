<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articolo — Victor Volley</title>
  <meta name="description" content="Leggi le ultime notizie dalla Victor Volley di Melissano.">
  <script>if(sessionStorage.getItem('vv_splash_shown')){document.documentElement.classList.add('no-splash');}</script>
  <noscript><style>#splash-screen{display:none!important}</style></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="splash-screen" role="status" aria-label="Caricamento Victor Volley">
    <div class="splash-top">
      <img src="assets/logo.png" alt="Victor Volley" class="splash-logo">
    </div>
    <div class="splash-line" aria-hidden="true"></div>
    <div class="splash-bottom" aria-hidden="true">
      <div class="splash-percent" id="splashPercent">0%</div>
    </div>
  </div>

  <header class="site-header" role="banner"></header>

  <main id="main-content">

    <section class="section">
      <div class="container">

        <div style="margin-bottom:32px">
          <a href="/news" style="color:var(--c-azzurro);font-size:14px;font-weight:500;text-decoration:none">
            &larr; Torna alle news
          </a>
        </div>

        <article class="article-content" id="articleContent">

          <!-- Copertina — 9:16 -->
          <div id="articleCover" class="article-cover"></div>

          <div class="article-header">
            <div class="article-meta" style="margin-bottom:16px">
              <span class="badge badge--azzurro" id="articleCategory"></span>
              <span class="article-date" id="articleDate"></span>
            </div>
            <h1 id="articleTitle"></h1>
          </div>

          <div class="article-body" id="articleBody"></div>

        </article>

        <!-- Articoli correlati -->
        <div id="relatedSection" style="margin-top:64px;padding-top:48px;border-top:1px solid var(--c-gray-light);display:none">
          <h3 style="margin-bottom:24px">Altri articoli</h3>
          <div class="related-cards" id="relatedGrid"></div>
        </div>

      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo"></footer>

  <!-- Firebase SDK (compat) -->
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>

  <script>
  (function () {
    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function badgeCls(cat) { return cat === 'Prima Divisione' ? 'badge--magenta' : 'badge--azzurro'; }
    function heroCatCls(cat) { return cat === 'Prima Divisione' ? 'hero-card-cat--magenta' : 'hero-card-cat--azzurro'; }

    var _qs  = (window.location.search.match(/[?&]id=([^&#]+)/) || [])[1];
    var _ss  = sessionStorage.getItem('vv_nav_id');
    var id   = parseInt(_qs || _ss || '', 10);
    sessionStorage.removeItem('vv_nav_id');
    if (isNaN(id) || id <= 0) { window.location.href = '/news'; return; }

    DB.load(['articles'], function () {
    var content = document.getElementById('articleContent');
    var article = VV.getArticle(id);

    if (!article) {
      content.innerHTML =
        '<p style="color:#888;text-align:center;padding:64px 0;font-size:16px">Articolo non trovato.<br>' +
        '<a href="/news" style="color:var(--c-azzurro)">Torna alle news</a></p>';
      return;
    }

    /* Cover — 9:16, coerente con hero/news card */
    var cover = document.getElementById('articleCover');
    cover.innerHTML = article.image
      ? '<img src="' + esc(article.image) + '" alt="' + esc(article.title) + '">'
      : '<div class="article-cover-placeholder">&#127944;</div>';

    /* Metadati */
    var catEl  = document.getElementById('articleCategory');
    catEl.className  = 'badge ' + badgeCls(article.category);
    catEl.textContent = article.category;
    document.getElementById('articleDate').textContent  = VV.formatDate(article.date);
    document.getElementById('articleTitle').textContent = article.title;
    document.title = article.title + ' — Victor Volley';

    /* Corpo */
    var bodyEl = document.getElementById('articleBody');
    bodyEl.innerHTML = article.content
      ? article.content
      : '<p style="color:#aaa;font-style:italic">Contenuto non disponibile.</p>';

    /* Articoli correlati — stessa card 9:16 e stessa animazione hover di hero/news */
    var others = VV.getArticles(true).filter(function (a) { return a.id !== article.id; }).slice(0, 3);
    if (others.length) {
      var relatedGrid = document.getElementById('relatedGrid');
      document.getElementById('relatedSection').style.display = '';
      relatedGrid.innerHTML = others.map(function (a) {
        var bgStyle = a.image
          ? 'background-image:url(' + esc(a.image) + ')'
          : 'background:linear-gradient(135deg,#053063,#008CFD)';
        return '<article class="hero-card" data-id="' + a.id + '">' +
          '<div class="hero-card-bg" style="' + bgStyle + '"></div>' +
          '<div class="hero-card-overlay"></div>' +
          '<div class="hero-card-content">' +
            '<span class="hero-card-cat ' + heroCatCls(a.category) + '">' + esc(a.category) + '</span>' +
            '<h2 class="hero-card-title">' + esc(a.title) + '</h2>' +
            '<a href="/news-dettaglio?id=' + a.id + '" class="hero-card-cta" ' +
               'onclick="sessionStorage.setItem(\'vv_nav_id\',\'' + a.id + '\')">Leggi &rarr;</a>' +
          '</div>' +
        '</article>';
      }).join('');

      var relatedCards = relatedGrid.querySelectorAll('.hero-card');
      relatedCards.forEach(function (card) {
        card.addEventListener('mouseenter', function () {
          relatedGrid.classList.add('has-hover');
          relatedCards.forEach(function (c) { c.classList.remove('is-hovered'); });
          card.classList.add('is-hovered');
        });
        card.addEventListener('mouseleave', function () {
          card.classList.remove('is-hovered');
          relatedGrid.classList.remove('has-hover');
        });
        card.addEventListener('click', function (e) {
          if (e.target.tagName === 'A') return;
          var relId = card.getAttribute('data-id');
          sessionStorage.setItem('vv_nav_id', relId);
          window.location.href = '/news-dettaglio?id=' + relId;
        });
      });
    }
    }); // DB.load
  })();
  </script>
</body>
</html>
