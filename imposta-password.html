<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <meta name="theme-color" content="#020d1a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scegli la password — Victor Volley</title>
  <link rel="preload" href="/assets/fonts/barlow-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/manrope-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css?v=c0ba2518">
  <link rel="stylesheet" href="css/atleta.css?v=302f42a7">
</head>
<body>

  <div class="al-login-screen">
    <div class="al-login-box">
      <img src="assets/logo.png" alt="Victor Volley" class="al-login-logo">
      <h1 class="al-login-title">Scegli la password</h1>
      <p class="al-login-sub">Area Atleti — Victor Volley</p>

      <p id="ipStato" class="al-login-sub" role="status">Controllo il link…</p>

      <form id="ipForm" class="is-hidden" autocomplete="off">
        <input type="email" id="ipEmail" class="al-login-input" autocomplete="username" readonly aria-label="La tua email">
        <input type="password" id="ipPwd" class="al-login-input" autocomplete="new-password" minlength="10" placeholder="Nuova password (min. 10)" required>
        <input type="password" id="ipPwd2" class="al-login-input" autocomplete="new-password" minlength="10" placeholder="Ripeti la password" required>
        <button type="submit" id="ipBtn" class="al-btn-primary">Salva la password</button>
        <p id="ipErr" class="al-login-error"></p>
      </form>

      <div id="ipFatto" class="is-hidden">
        <p class="al-login-ok" role="status">Password salvata. Ora puoi accedere con la tua email e la password appena scelta.</p>
        <a href="/atleta" class="al-btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:14px">Vai all’area atleti</a>
      </div>
    </div>
  </div>

  <script src="js/pages/imposta-password-1.js?v=55056c18"></script>
</body>
</html>
