<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria — Victor Volley</title>
  <meta name="description" content="Galleria fotografica della Victor Volley di Melissano: partite, allenamenti, eventi.">
  <script>if(sessionStorage.getItem('vv_splash_shown')){document.documentElement.classList.add('no-splash');}</script>
  <noscript><style>#splash-screen{display:none!important}</style></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-empty { text-align: center; padding: 80px 0; color: #aaa; font-size: 16px; line-height: 1.7; }
    .gallery-empty a { color: var(--c-azzurro); }

    /* ---- Elenco album ---- */
    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .album-card-pub {
      position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden;
      background: linear-gradient(135deg, #053063, #008CFD); color: #fff; text-decoration: none;
      box-shadow: 0 4px 18px rgba(3, 12, 28, 0.18);
    }
    .album-card-pub img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .album-card-pub::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,12,28,0) 35%, rgba(3,12,28,0.85) 100%); }
    .album-card-body { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
    .album-card-title { font-family: var(--font-heading); font-size: 20px; font-weight: 700; line-height: 1.2; }
    .album-card-meta { font-size: 12px; color: rgba(255,255,255,0.78); }
    @media (hover: hover) { .album-card-pub:hover img { transform: scale(1.05); } }
    .album-card-pub:focus-visible { outline: 3px solid var(--c-azzurro); outline-offset: 3px; }

    /* ---- Pagina di un album ---- */
    .gal-album-nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
    .gal-back { color: var(--c-navy); font-weight: 600; text-decoration: none; }
    .gal-back:hover { color: var(--c-azzurro); }
    .gal-switch { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #64748B; }
    .gal-switch select { font: inherit; padding: 8px 12px; border: 1px solid var(--c-gray-light); border-radius: 8px; background: #fff; color: var(--c-navy); max-width: min(70vw, 340px); }
    .gal-others { margin-top: 64px; padding-top: 40px; border-top: 1px solid var(--c-gray-light); }
    .gal-others-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .gal-others-hd h2 { font-size: 22px; margin: 0; }
    .gal-others-hd a { color: var(--c-azzurro); font-weight: 600; text-decoration: none; }

    /* Lightbox: overlay a schermo intero (position/inset/sfondo vengono da style.css) */
    .lightbox-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
      font-size: 24px; display: flex; align-items: center; justify-content: center;
      z-index: 601; transition: background 0.2s;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.28); }
    #lightboxPrev { left: 16px; }
    #lightboxNext { right: 16px; }
    .lightbox-body { text-align: center; max-width: 100vw; touch-action: pan-y; }
    #lightboxImg {
      max-width: 96vw;
      max-height: calc(100vh - 84px);
      max-height: calc(100dvh - 84px);
      width: auto; height: auto;
      border-radius: 6px; display: block; margin: 0 auto; object-fit: contain;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
    }
    #lightboxCaption { color: rgba(255,255,255,0.7); margin-top: 12px; font-size: 13px; }
    @media (max-width: 640px) {
      .lightbox-nav { width: 40px; height: 40px; font-size: 20px; }
      #lightboxPrev { left: 6px; }
      #lightboxNext { right: 6px; }
    }
  </style>
</head>
<body>

  <div id="splash-screen" role="status" aria-label="Caricamento Victor Volley">
    <div class="splash-top">
      <img src="/assets/logo.png" alt="Victor Volley" class="splash-logo">
    </div>
    <div class="splash-line" aria-hidden="true"></div>
    <div class="splash-bottom" aria-hidden="true">
      <div class="splash-percent" id="splashPercent">0%</div>
    </div>
  </div>

  <header class="site-header" role="banner"></header>

  <main id="main-content">

    <div class="page-header">
      <div class="container">
        <p class="breadcrumb" id="galBreadcrumb"><a href="/">Home</a> / Galleria</p>
        <h1 id="galTitle">Galleria</h1>
        <p id="galSubtitle" style="color:rgba(255,255,255,0.65);margin-top:8px">Momenti di gioco, allenamento ed eventi</p>
      </div>
    </div>

    <section class="section">
      <div class="container">

        <div id="galAlbumNav" class="gal-album-nav" style="display:none"></div>

        <div id="galleriaContainer">
          <div class="gallery-empty">
            <p>&#9203; Caricamento galleria&hellip;</p>
          </div>
        </div>

        <div id="galOthers" class="gal-others" style="display:none"></div>

      </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizzatore foto">
      <button class="lightbox-close" id="lightboxClose" aria-label="Chiudi">&times;</button>
      <button class="lightbox-nav" id="lightboxPrev" aria-label="Foto precedente" style="display:none">&#8249;</button>
      <button class="lightbox-nav" id="lightboxNext" aria-label="Foto successiva" style="display:none">&#8250;</button>
      <div class="lightbox-body">
        <img id="lightboxImg" src="" alt="">
        <p id="lightboxCaption"></p>
      </div>
    </div>

  </main>

  <footer class="site-footer" role="contentinfo"></footer>

  <!-- Firebase SDK (compat) -->
  <script src="/js/vendor/firebase-app-compat.js"></script>
  <script src="/js/vendor/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js?v=20260928"></script>
  <script src="/js/db.js"></script>
  <script src="/js/config.js?v=20260928"></script>
  <script src="/js/photodb.js?v=20260929"></script>
  <script src="/js/splash.js"></script>
  <script src="/js/components.js?v=20260928"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/main.js"></script>

  <script>
  /* /galleria            → elenco degli album (filtrabile per categoria)
     /galleria/<slug>     → foto di un album (vercel.json riscrive lo slug su questa stessa pagina) */
  (function () {
    function catSlug(s) { return String(s || '').toLowerCase().replace(/\s+/g, '-').replace(/[àáâ]/g,'a').replace(/[èéê]/g,'e').replace(/[ìí]/g,'i').replace(/[òó]/g,'o').replace(/[ùú]/g,'u'); }
    function esc(s)  { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function byId(id) { return document.getElementById(id); }

    var container   = byId('galleriaContainer');
    var albumNav    = byId('galAlbumNav');
    var others      = byId('galOthers');
    var lightboxEl  = byId('lightbox');
    var lightboxImg = byId('lightboxImg');
    var lightboxCap = byId('lightboxCaption');
    var prevBtn     = byId('lightboxPrev');
    var nextBtn     = byId('lightboxNext');

    /* ---- Lightbox ---- */
    var lbPhotos = [], lbIdx = 0, lbTitle = '';

    function showPhoto(idx) {
      lbIdx = idx;
      var p = lbPhotos[idx];
      lightboxImg.src = p.url;
      lightboxImg.alt = lbTitle;
      lightboxCap.textContent = (lbTitle ? lbTitle + ' — ' : '') + (idx + 1) + ' / ' + lbPhotos.length;
      prevBtn.style.display = lbPhotos.length > 1 ? '' : 'none';
      nextBtn.style.display = lbPhotos.length > 1 ? '' : 'none';
      /* Precarica le vicine, così scorrere con le frecce è immediato */
      [1, -1].forEach(function (d) {
        var n = lbPhotos[(idx + d + lbPhotos.length) % lbPhotos.length];
        if (n && n !== p) { var pre = new Image(); pre.src = n.url; }
      });
    }
    function openLightbox(photos, startIdx, title) {
      lbPhotos = photos; lbTitle = title || '';
      showPhoto(startIdx);
      lightboxEl.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightboxEl.classList.remove('is-open');
      document.body.style.overflow = '';
    }
    byId('lightboxClose').addEventListener('click', closeLightbox);
    lightboxEl.addEventListener('click', function (e) {
      if (e.target === lightboxEl || e.target.classList.contains('lightbox-body')) closeLightbox();
    });
    /* Swipe orizzontale su telefono: foto precedente / successiva */
    var touchX = null;
    lightboxEl.addEventListener('touchstart', function (e) { touchX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
    lightboxEl.addEventListener('touchend', function (e) {
      if (touchX === null || lbPhotos.length < 2) return;
      var dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) < 50) return;
      showPhoto((lbIdx + (dx < 0 ? 1 : -1) + lbPhotos.length) % lbPhotos.length);
    }, { passive: true });
    prevBtn.addEventListener('click', function () { showPhoto((lbIdx - 1 + lbPhotos.length) % lbPhotos.length); });
    nextBtn.addEventListener('click', function () { showPhoto((lbIdx + 1) % lbPhotos.length); });
    document.addEventListener('keydown', function (e) {
      if (!lightboxEl.classList.contains('is-open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   showPhoto((lbIdx - 1 + lbPhotos.length) % lbPhotos.length);
      if (e.key === 'ArrowRight')  showPhoto((lbIdx + 1) % lbPhotos.length);
    });

    /* ---- Helpers ---- */
    function hasPhotos(a) { return a.photos && a.photos.length; }
    function sortAlbums(list) {
      return list.slice().sort(function (a, b) {
        var da = a.date || '', db = b.date || '';
        if (da !== db) return da < db ? 1 : -1;
        return b.id - a.id;
      });
    }
    function albumHref(a) { return '/galleria/' + encodeURIComponent(VV.getAlbumSlug(a)); }
    function albumMeta(a) {
      return [a.date ? VV.formatDateShort(a.date) : '', (a.photos || []).length + ' foto'].filter(Boolean).join(' · ');
    }
    function cardsHtml(albums) {
      var covers = {};
      PhotoDB.getCovers(albums.map(function (a) { return a.id; }), function (c) { covers = c; });
      return albums.map(function (a) {
        return '<a class="album-card-pub" href="' + albumHref(a) + '" data-cat="' + catSlug(a.category) + '" aria-label="' + esc('Apri album: ' + a.title) + '">' +
          (covers[a.id] ? '<img src="' + covers[a.id] + '" alt="" loading="lazy" decoding="async">' : '') +
          '<span class="album-card-body">' +
            '<span class="album-card-title">' + esc(a.title) + '</span>' +
            '<span class="album-card-meta">' + esc(albumMeta(a)) + '</span>' +
          '</span></a>';
      }).join('');
    }
    function emptyHtml(msg) {
      return '<div class="gallery-empty"><p>' + msg + '<br><span style="font-size:12px">Le foto verranno caricate dalla societ&agrave;.</span></p></div>';
    }

    /* ---- Vista: elenco album ---- */
    function renderIndex(albums) {
      if (!albums.length) {
        container.innerHTML = emptyHtml('Nessun album ancora.');
        return;
      }
      container.innerHTML = '<div class="album-grid">' + cardsHtml(albums) + '</div>';

    }

    /* ---- Vista: un album ---- */
    function renderAlbum(album, albums) {
      var photos = [];
      PhotoDB.getPhotos(album.id, function (r) { photos = r; });

      document.title = album.title + ' — Galleria — Victor Volley';
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute('content', 'Foto dell\'album "' + album.title + '" — Victor Volley Melissano.');
      byId('galBreadcrumb').innerHTML = '<a href="/">Home</a> / <a href="/galleria">Galleria</a> / ' + esc(album.title);
      byId('galTitle').textContent = album.title;
      byId('galSubtitle').textContent = [album.date ? VV.formatDateShort(album.date) : '', photos.length + ' foto'].filter(Boolean).join(' · ');

      /* Barra di navigazione: torna all'elenco + salto rapido a un altro album */
      var nav = '<a class="gal-back" href="/galleria">&larr; Tutti gli album</a>';
      var elsewhere = albums.filter(function (a) { return a.id !== album.id; });
      if (elsewhere.length) {
        nav += '<label class="gal-switch">Vai a un altro album ' +
          '<select id="galSwitch"><option value="">Scegli…</option>' +
          elsewhere.map(function (a) { return '<option value="' + albumHref(a) + '">' + esc(a.title) + '</option>'; }).join('') +
          '</select></label>';
      }
      albumNav.innerHTML = nav;
      albumNav.style.display = '';
      var sel = byId('galSwitch');
      if (sel) sel.addEventListener('change', function () { if (sel.value) window.location.href = sel.value; });

      if (!photos.length) {
        container.innerHTML = emptyHtml('Nessuna foto in questo album.');
      } else {
        container.innerHTML = '<div class="gallery-grid">' + photos.map(function (p, i) {
          return '<div class="gallery-item" data-photo-idx="' + i + '" tabindex="0" role="button" aria-label="' + esc(album.title + ' — foto ' + (i + 1)) + '">' +
            '<img src="' + p.thumb + '" alt="' + esc(album.title) + '" loading="lazy" decoding="async">' +
          '</div>';
        }).join('') + '</div>';
        container.querySelectorAll('.gallery-item').forEach(function (item) {
          function open() { openLightbox(photos, parseInt(item.getAttribute('data-photo-idx'), 10), album.title); }
          item.addEventListener('click', open);
          item.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
        });
      }

      /* Altri album in fondo, così si continua a sfogliare senza tornare indietro */
      if (elsewhere.length) {
        others.innerHTML =
          '<div class="gal-others-hd"><h2>Altri album</h2><a href="/galleria">Vedi tutti &rarr;</a></div>' +
          '<div class="album-grid">' + cardsHtml(elsewhere.slice(0, 6)) + '</div>';
        others.style.display = '';
      }
    }

    function renderNotFound() {
      document.title = 'Album non trovato — Victor Volley';
      byId('galBreadcrumb').innerHTML = '<a href="/">Home</a> / <a href="/galleria">Galleria</a>';
      byId('galTitle').textContent = 'Album non trovato';
      byId('galSubtitle').textContent = '';
      container.innerHTML = '<div class="gallery-empty"><p>Questo album non esiste, o non &egrave; pi&ugrave; disponibile.<br>' +
        '<a href="/galleria">&larr; Torna a tutti gli album</a></p></div>';
    }

    /* ---- Avvio ---- */
    DB.load(['albums'], function () {
      var m = window.location.pathname.match(/^\/galleria\/([^\/]+)\/?$/);
      var albums = sortAlbums(VV.getAlbums().filter(hasPhotos));
      if (!m) { renderIndex(albums); return; }
      var album = VV.getAlbumBySlug(decodeURIComponent(m[1]));
      if (!album) renderNotFound(); else renderAlbum(album, albums);
    });
  })();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
