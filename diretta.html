<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diretta — Victor Volley</title>
  <meta name="description" content="Segui la diretta streaming su YouTube e il tabellone live delle partite della Victor Volley di Melissano.">
  <script>if(sessionStorage.getItem('vv_splash_shown')){document.documentElement.classList.add('no-splash');}</script>
  <noscript><style>#splash-screen{display:none!important}</style></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="splash-screen" role="status" aria-label="Caricamento Victor Volley">
    <div class="splash-top">
      <img src="assets/logo.png" alt="Victor Volley" class="splash-logo">
    </div>
    <div class="splash-line" aria-hidden="true"></div>
    <div class="splash-bottom" aria-hidden="true">
      <div class="splash-percent" id="splashPercent">0%</div>
    </div>
  </div>

  <header class="site-header" role="banner"></header>

  <main id="main-content">

    <div class="dt-sponsors-gold" id="direttaSponsorsGold"></div>

    <section class="section dt-live-section" aria-label="Diretta live">
      <div class="container">
        <div class="dt-live-grid">
          <div class="dt-video-col">
            <div class="dt-video-wrap" id="direttaVideo"></div>
          </div>
          <div class="dt-side-col">
            <div class="dt-tabellone" id="direttaTabellone">
              <p class="dt-loading">Caricamento tabellone&hellip;</p>
            </div>
            <p class="dt-video-msg" id="direttaVideoMsg" hidden></p>
          </div>
        </div>
      </div>
    </section>

    <div class="sponsor-ticker" id="sponsorTicker" aria-label="I nostri sponsor">
      <div class="sponsor-ticker-track" id="sponsorTickerTrack"></div>
    </div>

    <!-- CTA diventa sponsor -->
    <section class="cta-banner" aria-labelledby="dt-cta-title">
      <svg class="deco-ball" style="width:200px;right:-30px;top:50%;transform:translateY(-50%)" viewBox="0 0 200 200" fill="none" aria-hidden="true">
        <circle cx="100" cy="100" r="90" stroke="white" stroke-width="4"/>
        <path d="M100 10 Q140 55 100 100 Q60 55 100 10Z" stroke="white" stroke-width="3" fill="none"/>
        <path d="M100 190 Q60 145 100 100 Q140 145 100 190Z" stroke="white" stroke-width="3" fill="none"/>
        <path d="M10 100 Q55 60 100 100 Q55 140 10 100Z" stroke="white" stroke-width="3" fill="none"/>
        <path d="M190 100 Q145 140 100 100 Q145 60 190 100Z" stroke="white" stroke-width="3" fill="none"/>
      </svg>
      <div class="container" style="position:relative;z-index:1">
        <h2 id="dt-cta-title">Entra a far parte della famiglia Victor</h2>
        <p>Vuoi che il tuo brand sia visto da centinaia di appassionati ad ogni diretta? Diventa sponsor della Victor Volley e porta la tua attivit&agrave; in campo con noi.</p>
        <a href="/sponsor" class="btn btn--primary">Scopri come diventare sponsor</a>
        <a href="mailto:info@victorvolley.it?subject=Richiesta%20sponsorizzazione" class="btn btn--outline-white">Scrivici</a>
      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo"></footer>

  <!-- Firebase SDK (compat) -->
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>

  <!-- Supabase (tabellone live) -->
  <script src="js/vendor/supabase-js.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/diretta.js"></script>

  <!-- Sponsor di prova, solo in locale (vedi js/dev-sponsor-fixture.js) -->
  <script src="js/dev-sponsor-fixture.js"></script>

  <!-- Sponsor: Gold fissi in alto, Silver/Bronze a scorrimento sotto -->
  <script>
  (function () {
    DB.loadSponsors(function () {
      var goldEl = document.getElementById('direttaSponsorsGold');
      var ticker = document.getElementById('sponsorTicker');
      var track  = document.getElementById('sponsorTickerTrack');
      if (!goldEl || !ticker || !track) return;

      var sponsors = VV.getSponsors().filter(function (s) { return !!s.logo; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      if (!sponsors.length) return;

      function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      var gold = sponsors.filter(function (s) { return (s.livello || 'silver') === 'gold'; });
      var rest = sponsors.filter(function (s) { return (s.livello || 'silver') !== 'gold'; });

      if (gold.length) {
        var goldHtml = gold.map(function (s) {
          var inner = '<img src="' + esc(s.logo) + '" alt="' + esc(s.nome) + '" class="dt-sponsors-gold-logo">';
          return s.url
            ? '<a href="' + esc(s.url) + '" class="dt-sponsors-gold-item" target="_blank" rel="noopener">' + inner + '</a>'
            : '<div class="dt-sponsors-gold-item">' + inner + '</div>';
        }).join('');

        goldEl.innerHTML = '<div class="dt-sponsors-gold-track" id="direttaGoldTrack">' + goldHtml + '</div>';

        /* Su mobile: se i loghi non ci stanno su una riga, passa allo scorrimento
           automatico invece di andare a capo su più righe o restare minuscoli. */
        var goldTrack = document.getElementById('direttaGoldTrack');
        if (window.innerWidth <= 640 && gold.length > 1 && goldTrack.scrollWidth > goldEl.clientWidth + 4) {
          var dur = Math.max(12, gold.length * 5) + 's';
          goldTrack.className = 'dt-sponsors-gold-track is-scrolling';
          goldTrack.style.animationDuration = dur;
          goldTrack.innerHTML = goldHtml + goldHtml; /* duplica per loop seamless */
        }
      }

      if (rest.length) {
        function makeItem(s) {
          var inner = '<img src="' + esc(s.logo) + '" alt="' + esc(s.nome) + '" class="spt-logo">';
          return s.url
            ? '<a href="' + esc(s.url) + '" class="spt-item" target="_blank" rel="noopener">' + inner + '</a>'
            : '<div class="spt-item">' + inner + '</div>';
        }

        /* Ripetizioni intervallate: un round per volta, non tutte di fila,
           così un logo ripetuto ricompare solo dopo il turno degli altri. */
        function roundRobin(list) {
          var remaining = list.map(function (s) { return { s: s, left: Math.max(1, s.ripetizioni || 1) }; });
          var out = [];
          var any = true;
          while (any) {
            any = false;
            remaining.forEach(function (r) {
              if (r.left > 0) { out.push(r.s); r.left--; any = true; }
            });
          }
          return out;
        }

        var silver = rest.filter(function (s) { return (s.livello || 'silver') === 'silver'; });
        var bronze = rest.filter(function (s) { return s.livello === 'bronze'; });
        var silverSeq = roundRobin(silver);
        var bronzeSeq = roundRobin(bronze);

        /* Ogni silver è seguito da 2 bronze (a ciclo continuo sulla lista bronze) */
        var items = [];
        if (silverSeq.length && bronzeSeq.length) {
          var bi = 0;
          silverSeq.forEach(function (s) {
            items.push(s);
            items.push(bronzeSeq[bi % bronzeSeq.length]); bi++;
            items.push(bronzeSeq[bi % bronzeSeq.length]); bi++;
          });
        } else {
          items = silverSeq.length ? silverSeq : bronzeSeq;
        }

        var html = items.map(makeItem).join('');
        track.innerHTML = html + html; /* duplica per loop seamless */
        track.style.animationDuration = Math.max(15, items.length * 4) + 's';
        ticker.style.display = 'block';
      }
    });
  })();
  </script>

</body>
</html>
