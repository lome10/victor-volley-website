name: Controlli

# Si avvia a ogni push su main e a ogni pull request. Non serve installare nulla:
# gli script usano solo Node. In locale: npm test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
