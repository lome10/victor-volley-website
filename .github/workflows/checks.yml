name: Controlli

# Si avvia a ogni push su main e a ogni pull request. Installa i pacchetti (npm ci, da package-lock.json):
# servono al collaudo del PDF delle ricevute (pdf-lib). In locale: npm test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
