<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario e risultati — Victor Volley</title>
  <meta name="description" content="Calendario partite, risultati e classifica di Victor Volley Melissano. Prima Divisione, Under 19, Under 13, Under 12 e Minivolley.">
  <script>if(sessionStorage.getItem('vv_splash_shown')){document.documentElement.classList.add('no-splash');}</script>
  <noscript><style>#splash-screen{display:none!important}</style></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/calendario.css">
</head>
<body>

  <div id="splash-screen" role="status" aria-label="Caricamento Victor Volley">
    <div class="splash-top">
      <img src="assets/logo.png" alt="Victor Volley" class="splash-logo">
    </div>
    <div class="splash-line" aria-hidden="true"></div>
    <div class="splash-bottom" aria-hidden="true">
      <div class="splash-percent" id="splashPercent">0%</div>
    </div>
  </div>

  <header class="site-header" role="banner"></header>

  <main id="main-content">

    <div class="page-header page-header--calendario">
      <div class="container">
        <p class="breadcrumb"><a href="/">Home</a> / Calendario</p>
        <div class="cal-head-row">
          <div>
            <p class="cal-eyebrow" id="calStagioneLabel">Stagione</p>
            <h1>Calendario e risultati</h1>
          </div>
          <div class="cal-switch-group" id="calStagionNav" style="display:none"></div>
        </div>
      </div>
    </div>

    <div class="cal-dark-zone">

      <!-- Tab: Calendario / Risultati / Classifica -->
      <div class="container cal-tabs-row">
        <div class="cal-switch-group" role="tablist" aria-label="Sezioni calendario">
          <button type="button" class="is-active" role="tab" aria-selected="true" data-tab="calendario">Calendario</button>
          <button type="button" role="tab" aria-selected="false" data-tab="risultati">Risultati</button>
          <button type="button" role="tab" aria-selected="false" data-tab="classifica">Classifica</button>
        </div>
      </div>

      <!-- ===== CALENDARIO ===== -->
      <section class="cal-panel" id="panel-calendario" data-panel="calendario" aria-labelledby="prox-title">
        <h2 id="prox-title" class="sr-only">Prossime partite</h2>
        <nav class="cal-filter-zone" aria-label="Filtra per categoria">
          <div class="container"><div class="cal-filter-row" id="calFilterBar"></div></div>
        </nav>
        <div class="container">
          <div class="fixture-grid" id="upcomingGrid"></div>
        </div>
      </section>

      <!-- ===== RISULTATI ===== -->
      <section class="cal-panel is-hidden" id="panel-risultati" data-panel="risultati" aria-labelledby="ris-title">
        <h2 id="ris-title" class="sr-only">Risultati recenti</h2>
        <nav class="cal-filter-zone" aria-label="Filtra per categoria">
          <div class="container"><div class="cal-filter-row" id="risFilterBar"></div></div>
        </nav>
        <div class="container">
          <div class="fixture-grid" id="pastGrid"></div>
        </div>
      </section>

      <!-- ===== CLASSIFICA ===== -->
      <section class="cal-panel is-hidden" id="panel-classifica" data-panel="classifica" aria-labelledby="class-title">
        <h2 id="class-title" class="sr-only">Classifica Prima Divisione</h2>
        <div class="container" style="padding:28px 24px 56px;max-width:640px;margin:0 auto">
          <div class="stand-panel" id="classificaWrap">
            <p class="stand-empty">Caricamento classifica&hellip;</p>
          </div>
        </div>
      </section>

    </div>

  </main>

  <footer class="site-footer" role="contentinfo"></footer>

  <!-- Firebase SDK (compat) -->
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
  <script src="js/girone.js"></script>

  <script>
  (function () {
    function slug(s) { return s.toLowerCase().replace(/\s+/g, '-').replace(/[àáâ]/g,'a').replace(/[èéê]/g,'e').replace(/[ìí]/g,'i').replace(/[òó]/g,'o').replace(/[ùú]/g,'u'); }
    function esc(s)  { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function isVV(nome) { return (nome || '').toLowerCase().indexOf('victor') !== -1; }

    var PIN_ICON = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>';

    var MESI_SHORT = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
    function formatDataCard(dateStr, ora) {
      var d = new Date(dateStr + 'T00:00:00');
      return d.getDate() + ' ' + MESI_SHORT[d.getMonth()] + (ora ? ' · ' + ora : '');
    }
    function dayOfMonth(dateStr) {
      return new Date(dateStr + 'T00:00:00').getDate();
    }

    function inSeason(p, seasonId) { return !p.stagione || p.stagione === seasonId; }

    /* ================================================
       TAB SWITCHING
    ================================================ */
    var TABS = ['calendario', 'risultati', 'classifica'];
    var _classificaLoaded = false;

    function activateTab(tab) {
      if (TABS.indexOf(tab) < 0) tab = 'calendario';
      document.querySelectorAll('.cal-tabs-row .cal-switch-group button').forEach(function (b) {
        var active = b.dataset.tab === tab;
        b.classList.toggle('is-active', active);
        b.setAttribute('aria-selected', String(active));
      });
      document.querySelectorAll('.cal-panel').forEach(function (p) {
        p.classList.toggle('is-hidden', p.dataset.panel !== tab);
      });
      if (tab === 'classifica' && !_classificaLoaded) {
        _classificaLoaded = true;
        renderClassificaTab();
      }
      if (history.replaceState) history.replaceState(null, '', '#' + tab);
    }

    document.querySelectorAll('.cal-tabs-row .cal-switch-group button').forEach(function (btn) {
      btn.addEventListener('click', function () { activateTab(btn.dataset.tab); });
    });

    /* ================================================
       CLASSIFICA (Prima Divisione — dati girone.json)
    ================================================ */
    function standRow(r, squadre, homeId) {
      var s = Girone.squadraById(squadre, r.id);
      var isHome = r.id === homeId;
      var logo = s.logo
        ? '<img src="' + esc(s.logo) + '" class="stand-logo" alt="">'
        : '<span class="stand-logo-init">' + esc((s.nome || '?').charAt(0)) + '</span>';
      return '<tr' + (isHome ? ' class="stand-row--vv"' : '') + '>' +
        '<td class="stand-pos">' + (r._pos) + '</td>' +
        '<td><div class="stand-name">' + logo + esc(s.nome) + '</div></td>' +
        '<td class="stand-stat">' + r.v + '</td>' +
        '<td class="stand-stat">' + r.p + '</td>' +
        '<td class="stand-pts">' + r.pts + '</td>' +
      '</tr>';
    }

    function renderClassificaTab() {
      var wrap = document.getElementById('classificaWrap');
      if (!window.Girone) { wrap.innerHTML = '<p class="stand-empty">Classifica non disponibile.</p>'; return; }

      Girone.loadGirone().then(function (girone) {
        if (!girone || !girone.squadre || !girone.partite) {
          wrap.innerHTML = '<p class="stand-empty">Classifica non ancora disponibile.</p>';
          return;
        }
        var classifica  = Girone.calcolaClassifica(girone);
        classifica.forEach(function (r, i) { r._pos = i + 1; });
        var homeSquadra = girone.squadre.filter(function (s) { return s.home; })[0];
        var homeId      = homeSquadra ? homeSquadra.id : null;
        var sub = (girone.categoria || 'Prima Divisione') +
          (girone.girone ? ' — Girone ' + girone.girone : '') +
          (girone.stagione ? ' · Stagione ' + girone.stagione : '');

        wrap.innerHTML =
          '<div class="stand-head">' +
            '<div class="stand-title">Classifica</div>' +
            '<div class="stand-sub">' + esc(sub) + '</div>' +
          '</div>' +
          '<table class="stand-table">' +
            '<thead><tr>' +
              '<th class="stand-pos">#</th><th>Squadra</th>' +
              '<th class="stand-stat" title="Vittorie">V</th>' +
              '<th class="stand-stat" title="Sconfitte">P</th>' +
              '<th class="stand-pts">Pt</th>' +
            '</tr></thead>' +
            '<tbody>' + classifica.map(function (r) { return standRow(r, girone.squadre, homeId); }).join('') + '</tbody>' +
          '</table>' +
          '<div class="stand-footer">' + esc(girone.stagione || '') + '</div>';
      }).catch(function () {
        wrap.innerHTML = '<p class="stand-empty">Classifica non disponibile al momento.</p>';
      });
    }

    /* ================================================
       CALENDARIO / RISULTATI (dati partite — tutte le categorie)
    ================================================ */
    DB.load(['seasons', 'partite'], function () {
    var seasons      = VV.getSeasons();
    var activeSeason = VV.getCurrentSeason() || seasons[0];

    var stagionNav = document.getElementById('calStagionNav');
    var label      = document.getElementById('calStagioneLabel');

    if (seasons.length > 1) {
      stagionNav.style.display = '';
      stagionNav.innerHTML = seasons.map(function (s) {
        return '<button type="button"' + (s.id === activeSeason.id ? ' class="is-active"' : '') + ' data-season="' + esc(s.id) + '">' + esc(s.name || s.id) + '</button>';
      }).join('');
      stagionNav.querySelectorAll('[data-season]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          stagionNav.querySelectorAll('[data-season]').forEach(function (b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          activeSeason = seasons.find(function (s) { return s.id === btn.dataset.season; }) || activeSeason;
          label.textContent = 'Stagione ' + activeSeason.id;
          renderMatches();
        });
      });
    }

    label.textContent = 'Stagione ' + activeSeason.id;

    var today      = new Date().toISOString().slice(0, 10);
    var allPartite = VV.getPartite();

    function resultClass(p) {
      if (p.set_casa == null || p.set_ospite == null) return '';
      var vvSets  = isVV(p.squadra_casa) ? p.set_casa   : p.set_ospite;
      var oppSets = isVV(p.squadra_casa) ? p.set_ospite : p.set_casa;
      return vvSets > oppSets ? 'vittoria' : 'sconfitta';
    }

    function teamLogo(src, nome) {
      return src
        ? '<img src="' + esc(src) + '" alt="" class="fixture-team-logo">'
        : '<span class="fixture-team-logo-init">' + esc((nome || '?').charAt(0).toUpperCase()) + '</span>';
    }

    function fixtureCard(p, isResult) {
      var isHome   = isVV(p.squadra_casa);
      var hasScore = p.set_casa != null && p.set_ospite != null;
      var rCls     = hasScore ? resultClass(p) : '';

      var ghost = isResult && hasScore
        ? '<div class="fixture-ghost fixture-ghost--score">' + p.set_casa + '&ndash;' + p.set_ospite + '</div>'
        : '<div class="fixture-ghost">' + dayOfMonth(p.data) + '</div>';

      var middle = (isResult && hasScore)
        ? '<div class="fixture-score-row"><span class="fixture-score fixture-score--' + rCls + '">' + p.set_casa + '&ndash;' + p.set_ospite + '</span></div>'
        : '<div class="fixture-vs">vs</div>';

      return '<div class="fixture-card ' + (isHome ? 'cool' : 'warm') + ' reveal" data-cat="' + slug(p.categoria) + '">' +
        ghost +
        '<span class="fixture-cat-badge">' + esc(p.categoria) + '</span>' +
        '<div class="fixture-body">' +
          '<div class="fixture-date">' + formatDataCard(p.data, p.ora) + '</div>' +
          '<div class="fixture-teams">' +
            '<div class="fixture-team' + (isHome ? ' fixture-team--vv' : '') + '">' + teamLogo(p.logo_casa, p.squadra_casa) + '<span class="fixture-team-name">' + esc(p.squadra_casa) + '</span></div>' +
            '<div class="fixture-team' + (!isHome ? ' fixture-team--vv' : '') + '">' + teamLogo(p.logo_ospite, p.squadra_ospite) + '<span class="fixture-team-name">' + esc(p.squadra_ospite) + '</span></div>' +
          '</div>' +
          middle +
          '<div class="fixture-meta">' +
            '<span class="fixture-meta-venue">' + PIN_ICON + esc(p.palazzetto || '—') + '</span>' +
            '<span class="fixture-tag fixture-tag--' + (isHome ? 'casa' : 'trasferta') + '">' + (isHome ? 'Casa' : 'Trasferta') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function renderFilterBar(el, cats, gridId) {
      el.innerHTML = '<button class="cal-chip is-active" data-filter="all">Tutte</button>' +
        cats.map(function (c) {
          return '<button class="cal-chip" data-filter="' + slug(c) + '">' + esc(c) + '</button>';
        }).join('');
      el.querySelectorAll('.cal-chip').forEach(function (btn) {
        btn.addEventListener('click', function () {
          el.querySelectorAll('.cal-chip').forEach(function (b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          var f = btn.getAttribute('data-filter');
          document.querySelectorAll('#' + gridId + ' [data-cat]').forEach(function (card) {
            card.style.display = (f === 'all' || card.getAttribute('data-cat') === f) ? '' : 'none';
          });
        });
      });
    }

    function uniqueCats(list) {
      var cats = [];
      list.forEach(function (p) { if (cats.indexOf(p.categoria) < 0) cats.push(p.categoria); });
      return cats;
    }

    function renderMatches() {
      var partite  = allPartite.filter(function (p) { return inSeason(p, activeSeason.id); });
      var upcoming = partite.filter(function (p) { return p.stato !== 'conclusa' && p.data >= today; });
      var past     = partite.filter(function (p) { return p.stato === 'conclusa' || p.data < today; }).reverse();

      renderFilterBar(document.getElementById('calFilterBar'), uniqueCats(upcoming), 'upcomingGrid');
      renderFilterBar(document.getElementById('risFilterBar'), uniqueCats(past), 'pastGrid');

      document.getElementById('upcomingGrid').innerHTML = upcoming.length
        ? upcoming.map(function (p) { return fixtureCard(p, false); }).join('')
        : '<div class="fixture-grid-empty">Nessuna partita in programma.</div>';

      document.getElementById('pastGrid').innerHTML = past.length
        ? past.map(function (p) { return fixtureCard(p, true); }).join('')
        : '<div class="fixture-grid-empty">Nessun risultato ancora.</div>';
    }

    renderMatches();
    }); // DB.load

    /* Tab iniziale: da hash URL, altrimenti Calendario */
    activateTab(location.hash.slice(1) || 'calendario');
  })();
  </script>
</body>
</html>
